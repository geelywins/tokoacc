<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toko Aksesoris Mobil</title>
<meta name="theme-color" content="#16202B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --ink:#16202B; --ink-2:#2A3644; --blue:#1F4FD1; --blue-soft:#E6EDFC; --amber:#FFB020; --amber-soft:#FFF4DC;
  --price:#D6421E; --ok:#12A36B; --bg:#EEF1F5; --card:#FFFFFF; --line:#DCE2EA; --muted:#66727F;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button{font-family:inherit}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none;min-width:0}
.brand img{width:34px;height:34px;border-radius:9px;object-fit:cover;background:#fff}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.search{flex:1;display:flex;align-items:center;background:#fff;border-radius:10px;height:40px;padding:0 12px;gap:8px;min-width:0}
.search input{border:0;outline:0;flex:1;font:inherit;font-size:14px;color:var(--ink);min-width:0;background:transparent}
.search svg{flex:none;color:var(--muted)}
.icon-btn{all:unset;cursor:pointer;position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;flex:none}
.icon-btn:hover{background:var(--ink-2)}
.count{position:absolute;top:3px;right:1px;background:var(--amber);color:var(--ink);font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.count:empty{display:none}
@media (max-width:640px){ .brand-name{display:none} .top .wrap{gap:8px} }

main{min-height:calc(100vh - 62px)}
#app{padding-bottom:var(--bottom-space, calc(110px + env(safe-area-inset-bottom,0px)))}

/* home */
.hero{margin:16px 0 0;position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r-lg);scrollbar-width:none;background:var(--ink-2)}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:12/5;border:0;padding:0;cursor:pointer;background:var(--ink-2)}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
.dots button{all:unset;cursor:pointer;width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.55);transition:width .2s}
.dots button.on{width:20px;background:#fff}
.cats{display:flex;gap:10px;margin:18px 0 6px;overflow-x:auto;scrollbar-width:none}
.cat{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px 10px 10px;font-weight:700;white-space:nowrap}
.cat .ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
.cat[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.015em}
.sec-head a{font-size:13px;font-weight:700;color:var(--blue);text-decoration:none}
.ads{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.ads button{all:unset;cursor:pointer;border-radius:var(--r-md);overflow:hidden;aspect-ratio:8/3;background:var(--ink-2);display:block}
.ads img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:640px){ .ads{grid-template-columns:1fr} }

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){ .grid{grid-template-columns:repeat(3,1fr)} }
@media (min-width:1000px){ .grid{grid-template-columns:repeat(4,1fr);gap:16px} }
.pcard{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--card);border-radius:var(--r-md);overflow:hidden;border:1px solid transparent}
.pcard:hover{border-color:var(--line);box-shadow:0 6px 18px rgba(22,32,43,.08)}
.pimg{aspect-ratio:1/1;background:#DDE3EA;position:relative;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;color:#97A3B0}
.tag{position:absolute;left:8px;top:8px;background:var(--amber);color:var(--ink);font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px}
.tag.dark{background:var(--ink);color:#fff;left:auto;right:8px}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcat{font-size:11.5px;color:var(--muted);font-weight:600}
.pname{font-weight:700;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pprice{color:var(--price);font-weight:800;font-size:15.5px;margin-top:auto}
.pprice small{color:var(--muted);font-weight:600;font-size:11.5px;display:block}
.swatch{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px}
.swatch span{flex:1}

/* detail */
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:700;margin:16px 0 12px;color:var(--ink-2)}
.detail{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){ .detail{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:start} .gallery{position:sticky;top:78px} }
.panel{background:var(--card);border-radius:var(--r-lg);padding:18px}
.gallery .main{aspect-ratio:1/1;border-radius:var(--r-md);overflow:hidden;background:#DDE3EA;position:relative}
.gallery .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.thumbs button{all:unset;cursor:pointer;width:62px;height:62px;border-radius:8px;overflow:hidden;border:2px solid transparent;flex:none;background:#DDE3EA}
.thumbs button[aria-current="true"]{border-color:var(--blue)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.d-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;line-height:1.25}
.d-price{font-size:26px;font-weight:800;color:var(--price);letter-spacing:-.02em}
.d-strike{color:var(--muted);text-decoration:line-through;font-size:14px;font-weight:600;margin-left:8px}
.vbadge{display:inline-flex;align-items:center;gap:6px;background:var(--amber-soft);color:#8A5A00;border:1px dashed var(--amber);font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:8px;margin-top:8px}
.opt{margin-top:18px}
.opt-label{font-weight:700;font-size:13.5px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.opt-label span{color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13.5px;background:#fff}
.chip small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.chip:disabled{opacity:.4;cursor:not-allowed}
select.inp,input.inp,textarea.inp{width:100%;font:inherit;font-size:14px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea.inp{resize:vertical;min-height:70px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{all:unset;cursor:pointer;width:38px;height:38px;text-align:center;font-size:18px;font-weight:700}
.qty span{min-width:36px;text-align:center;font-weight:700}
.desc{white-space:pre-line;color:var(--ink-2);margin:0}

/* tint preview — signature element */
.tint{background:linear-gradient(180deg,#DDE9F3 0%,#F3F7FA 70%);border-radius:var(--r-md);padding:12px 12px 6px;margin-top:10px}
.tint svg{width:100%;height:auto;display:block}
.tint-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);padding:6px 4px 4px}
.tint-legend b{font-weight:800}
.tint .glass{transition:fill-opacity .35s ease}
@media (prefers-reduced-motion:reduce){ .tint .glass{transition:none} .dots button{transition:none} }

.buybar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.buybar .tot{flex:1;min-width:0}
.buybar .tot small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
.buybar .tot b{color:var(--price);font-size:18px;font-weight:800}
@media (max-width:899px){ .buybar .btn{padding:0 13px;font-size:13.5px;height:44px} .buybar .tot b{font-size:16px} }
@media (min-width:900px){ .buybar{position:static;border:0;padding:0;margin-top:22px} }
.btn{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:12px;font-weight:800;font-size:14.5px;background:var(--blue);color:#fff;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn.line{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.amber{background:var(--amber);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* cart & checkout */
.page-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:18px 0 12px}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){ .cols{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start} .cols .sticky{position:sticky;top:78px} }
.citem{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.citem:first-child{border-top:0;padding-top:0}
.citem .cimg{width:76px;height:76px;border-radius:10px;overflow:hidden;background:#DDE3EA}
.citem .cimg img{width:100%;height:100%;object-fit:cover}
.cname{font-weight:700}
.copts{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link-btn{all:unset;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:700}
.link-btn:hover{color:var(--price)}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.sum-row.disc{color:var(--ok);font-weight:700}
.sum-row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-weight:800;font-size:17px}
.sum-row.total span:last-child{color:var(--price)}
.field{margin-bottom:12px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){ .two{grid-template-columns:1fr} }
.radio-card{all:unset;cursor:pointer;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:#fff}
.radio-card[aria-checked="true"]{border-color:var(--blue);background:var(--blue-soft)}
.radio-card .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;background:#fff}
.radio-card[aria-checked="true"] .dot{border:5px solid var(--blue)}
.radio-card .rc-t{font-weight:700}
.radio-card .rc-s{font-size:12.5px;color:var(--muted)}
.radio-card .rc-p{margin-left:auto;font-weight:800;white-space:nowrap}
.err{color:var(--price);font-size:12.5px;font-weight:700;margin-top:6px}

/* order */
.ok-head{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:20px;margin-top:16px}
.ok-head h1{margin:0 0 4px;font-size:21px;letter-spacing:-.015em}
.ok-head p{margin:0;color:#C7D0DA}
.steps{display:flex;gap:0;margin:16px 0 4px}
.steps div{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--muted);position:relative;padding-top:18px}
.steps div::before{content:"";position:absolute;top:4px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--line);transform:translateX(-50%)}
.steps div::after{content:"";position:absolute;top:8px;left:calc(50% + 7px);right:calc(-50% + 7px);height:2px;background:var(--line)}
.steps div:last-child::after{display:none}
.steps div.on{color:var(--ink)}
.steps div.on::before{background:var(--ok)}
.steps div.on::after{background:var(--ok)}
.bank{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.bank b{font-size:15px;letter-spacing:.02em}
.qris{max-width:260px;border-radius:12px;border:1px solid var(--line);display:block;margin:6px 0}
.olist .orow{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;width:100%;box-sizing:border-box}
.status{font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;background:var(--amber-soft);color:#8A5A00;white-space:nowrap}
.status.s-dibayar,.status.s-diproses,.status.s-dikirim{background:var(--blue-soft);color:var(--blue)}
.status.s-selesai{background:#E3F6EE;color:var(--ok)}
.status.s-batal{background:#FDE8E3;color:var(--price)}

/* bottom nav (mobile) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;position:relative}
.bnav a[aria-current="page"]{color:var(--blue)}
.bnav .count{top:2px;right:calc(50% - 22px)}
@media (min-width:900px){ .bnav{display:none} }
.hide-bnav .bnav{display:none}

.empty{background:var(--card);border-radius:var(--r-lg);padding:36px 20px;text-align:center;color:var(--muted);margin-top:16px}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:17px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:700;font-size:13.5px;z-index:60;max-width:92vw;text-align:center}
.skel{background:linear-gradient(90deg,#E2E7ED 0%,#EEF1F5 50%,#E2E7ED 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r-md)}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){ .skel{animation:none} }
.foot{color:var(--muted);font-size:12.5px;text-align:center;padding:30px 0 10px}

/* v2 additions */
.top .acct{color:#fff}

.subchips{margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:#FAFBFD}
.subchips .opt-label{font-weight:600}
.car-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.deal-tag{background:var(--price);color:#fff}
.pprice s{display:block;color:var(--muted);font-weight:600;font-size:12px}
.promo-box{display:flex;gap:8px;margin-top:12px}
.promo-box input{flex:1;text-transform:uppercase;letter-spacing:.05em}
.promo-box .btn{height:44px}
.promo-ok{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#E3F6EE;border:1px solid #BFE8D5;color:#0B6B47;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;margin-top:12px}
.pcode{border:1.5px dashed var(--amber);background:var(--amber-soft);border-radius:var(--r-md);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.pcode b{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.06em}
.pcode small{display:block;color:#8A5A00;font-weight:600}
.auth-card{max-width:440px;margin:24px auto 0}
.auth-card h1{font-size:23px;letter-spacing:-.02em;margin:0 0 4px}
.auth-card p.sub{color:var(--muted);margin:0 0 18px}
.auth-alt{text-align:center;margin-top:14px;font-size:13.5px;color:var(--muted)}
.auth-alt a{color:var(--blue);font-weight:700;text-decoration:none}
.pw{position:relative}
.pw button{all:unset;cursor:pointer;position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--blue)}
.ok-msg{background:#E3F6EE;color:#0B6B47;border-radius:10px;padding:12px 14px;font-weight:600}
.acct-head{display:flex;gap:14px;align-items:center;background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:18px;margin-top:16px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--amber);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
@media (max-width:640px){ .cat-grid{grid-template-columns:repeat(4,1fr);gap:8px} }
.cat-tile{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;font-weight:700;line-height:1.25}
.cat-tile .ico{width:54px;height:54px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px}
.cat-tile:hover .ico{border-color:var(--blue)}
/* ===================== v3: tampilan baru ===================== */
:root{ --shadow-sm:0 1px 2px rgba(22,32,43,.06),0 2px 8px rgba(22,32,43,.05); --shadow-md:0 10px 28px rgba(22,32,43,.12); --grad-ink:linear-gradient(135deg,#0F1822 0%,#1B2A3A 55%,#243B57 100%); }
body{background:radial-gradient(1200px 400px at 50% -120px,#DDE6F2 0%,transparent 70%),var(--bg)}
.top{background:var(--grad-ink);box-shadow:0 4px 18px rgba(15,24,34,.25)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--amber),#FF7A45 45%,var(--blue));opacity:.9}
.search{border-radius:12px;height:42px;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--amber)}
.search-wrap{position:relative;flex:1;min-width:0;display:flex}
.suggest{position:absolute;left:0;right:0;top:48px;background:#fff;border-radius:14px;box-shadow:var(--shadow-md);overflow:hidden;z-index:40;color:var(--ink)}
.suggest a{display:flex;align-items:center;gap:10px;padding:10px 14px;text-decoration:none;border-top:1px solid var(--line)}
.suggest a:first-child{border-top:0}
.suggest a:hover,.suggest a:focus{background:var(--blue-soft);outline:none}
.suggest .s-ico{width:34px;height:34px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.suggest .s-ico img{width:100%;height:100%;object-fit:cover}
.suggest .s-name{font-weight:700;font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest .s-price{font-weight:800;color:var(--price);font-size:13px;white-space:nowrap}
.suggest .s-all{justify-content:center;font-weight:700;color:var(--blue);font-size:13px}

@keyframes fadeUp{from{opacity:0}to{opacity:1}}
#app.fade>*{animation:fadeUp .32s ease both}
#app.fade>*:nth-child(2){animation-delay:.04s} #app.fade>*:nth-child(3){animation-delay:.08s} #app.fade>*:nth-child(4){animation-delay:.12s}
@media (prefers-reduced-motion:reduce){ #app.fade>*{animation:none} }

/* sapaan + hero */
.hello{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 0}
.hello b{font-size:18px;letter-spacing:-.015em}
.hello span{color:var(--muted);font-size:13px;display:block}
.hello a{font-size:12.5px;font-weight:700;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 12px;white-space:nowrap}
.slides{box-shadow:var(--shadow-md)}
.hero-fb{margin-top:14px;border-radius:20px;background:var(--grad-ink);color:#fff;padding:22px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow-md);display:grid;grid-template-columns:1.15fr 1fr;gap:10px;align-items:center;min-height:190px}
.hero-fb::before{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,32,.35),transparent 65%)}
.hero-fb h1{margin:6px 0 8px;font-size:clamp(21px,5.2vw,32px);line-height:1.12;letter-spacing:-.03em;font-weight:800}
.hero-fb h1 em{font-style:normal;background:linear-gradient(90deg,var(--amber),#FF8A4C);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-fb p{margin:0 0 14px;color:#C9D3DE;font-size:13px;max-width:34ch}
.hero-fb .kicker{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.35);padding:4px 9px;border-radius:20px}
.hero-fb .btn{height:42px;font-size:14px}
.hero-fb svg{width:100%;height:auto;position:relative;z-index:1;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.hero-fb .hero-car .glass{animation:tint 6s ease-in-out infinite}
.hero-fb .hero-car .glass:nth-of-type(2){animation-delay:.6s} .hero-fb .hero-car .glass:nth-of-type(3){animation-delay:1.2s} .hero-fb .hero-car .glass:nth-of-type(4){animation-delay:1.8s}
@keyframes tint{0%,100%{fill-opacity:.25}50%{fill-opacity:.9}}
@media (prefers-reduced-motion:reduce){ .hero-fb .hero-car .glass{animation:none;fill-opacity:.7} }
@media (max-width:520px){ .hero-fb{grid-template-columns:1fr;padding:20px 18px 12px} .hero-fb svg{max-width:300px;margin:0 auto -6px} }

/* trust strip */
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.trust div{background:#fff;border-radius:14px;padding:10px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow-sm);font-size:11.5px;line-height:1.3;color:var(--ink-2)}
.trust b{display:block;font-size:12.5px;color:var(--ink)}
.trust i{font-style:normal;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
@media (max-width:560px){ .trust{grid-template-columns:1fr 1fr 1fr} .trust div{flex-direction:column;text-align:center;padding:10px 6px} }

/* kategori */
.cat-grid{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:18px -16px 4px;padding:2px 16px 6px}
.cat-grid::-webkit-scrollbar{display:none}
.cat-tile{min-width:74px;flex:none}
.cat-tile .ico{width:60px;height:60px;border-radius:18px;border:0;box-shadow:var(--shadow-sm);font-size:26px;transition:transform .15s}
.cat-tile:nth-child(4n+1) .ico{background:linear-gradient(145deg,#E6EDFC,#fff)}
.cat-tile:nth-child(4n+2) .ico{background:linear-gradient(145deg,#FFF1D6,#fff)}
.cat-tile:nth-child(4n+3) .ico{background:linear-gradient(145deg,#E1F5EC,#fff)}
.cat-tile:nth-child(4n+4) .ico{background:linear-gradient(145deg,#FDE6DF,#fff)}
.cat-tile:hover .ico{transform:translateY(-2px)}

/* judul seksi */
.sec-head h2{display:flex;align-items:center;gap:8px}
.sec-head h2::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(var(--amber),#FF7A45)}
.sec-head a{background:var(--blue-soft);padding:5px 10px;border-radius:20px;font-size:12px}

/* kartu produk */
.pcard{border-radius:16px;box-shadow:var(--shadow-sm);border:0;transition:transform .15s,box-shadow .15s;position:relative}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border:0}
.pimg{background:linear-gradient(160deg,#E4EAF1,#D3DCE6)}
.pimg img{transition:transform .35s ease}
.pcard:hover .pimg img{transform:scale(1.05)}
.tag{border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.deal-tag{background:linear-gradient(135deg,#E0431C,#FF7A45)}
.fav{all:unset;cursor:pointer;position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2;transition:transform .12s}
.fav:active{transform:scale(.88)}
.fav svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}
.fav[aria-pressed="true"] svg{fill:#E0431C;stroke:#E0431C}
.tag.dark{top:8px}
.size-note{margin-top:8px;font-size:12.5px;color:var(--ink-2);background:var(--blue-soft);border-radius:10px;padding:8px 11px}
.size-note.ok{background:#E3F6EE;color:#0B6B47}
.size-note.warn{background:var(--amber-soft);color:#8A5A00;font-weight:600}
.pbody{padding:11px 12px 13px}
.pprice{font-size:16px}

/* sort & filter */
.sortbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-2px -16px 14px;padding:2px 16px}
.sortbar::-webkit-scrollbar{display:none}
.sortbar button{all:unset;cursor:pointer;white-space:nowrap;background:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-sm);color:var(--ink-2)}
.sortbar button[aria-pressed="true"]{background:var(--ink);color:#fff}
.sortbar .sep{width:1px;background:var(--line);flex:none;margin:4px 2px}
.count-note{color:var(--muted);font-size:12.5px;margin:-6px 0 12px}

/* detail produk */
.panel{border-radius:18px;box-shadow:var(--shadow-sm)}
.d-actions{display:flex;gap:8px;margin:2px 0 6px}
.d-actions button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border:1.5px solid var(--line);border-radius:20px;padding:6px 12px;background:#fff}
.d-actions svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.d-actions button[aria-pressed="true"]{color:#E0431C;border-color:#F4B5A3;background:#FFF1EC}
.d-actions button[aria-pressed="true"] svg{fill:#E0431C;stroke:#E0431C}
.chip{border-radius:12px;transition:border-color .12s,background .12s}
.chip[aria-pressed="true"]{box-shadow:0 0 0 3px rgba(31,79,209,.12)}
.buybar{box-shadow:0 -8px 24px rgba(22,32,43,.08)}
.btn{border-radius:12px;transition:filter .12s,transform .08s}
.btn:active{transform:scale(.98)}
.btn:not(.line):not(.amber){background:linear-gradient(135deg,#1F4FD1,#3A6BF0)}
.btn.amber{background:linear-gradient(135deg,#FFB020,#FF9A3C)}

/* bottom nav */
.bnav{backdrop-filter:saturate(1.4) blur(10px);background:rgba(255,255,255,.94);box-shadow:0 -6px 20px rgba(22,32,43,.07)}
.bnav a{transition:color .15s}
.bnav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.bnav a[aria-current="page"] svg{transform:translateY(-1px)}

/* WhatsApp mengambang */
.fab-wa{position:fixed;right:16px;bottom:calc(var(--bottom-space,90px) - 12px);z-index:22;width:52px;height:52px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(37,211,102,.45);text-decoration:none;transition:transform .15s}
.fab-wa:hover{transform:scale(1.06)}
.fab-wa svg{width:28px;height:28px;fill:#fff}
.hide-bnav .fab-wa,.no-fab .fab-wa{display:none}

/* strip horizontal (baru dilihat) */
.hstrip{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x proximity}
.hstrip::-webkit-scrollbar{display:none}
.hstrip .pcard{flex:0 0 150px;scroll-snap-align:start}
.empty{border-radius:18px;box-shadow:var(--shadow-sm)}
.empty .big{font-size:40px;display:block;margin-bottom:6px}

/* ===================== v4: carousel banner & pilihan kaca ===================== */
.car{margin-top:14px}
.car-stage{position:relative}
.car-track{--sw:90%;--gap:10px;position:relative;display:flex;gap:var(--gap);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 0 12px;overscroll-behavior-x:contain}
.car-track::-webkit-scrollbar{display:none}
.car-track::before,.car-track::after{content:"";flex:0 0 calc((100% - var(--sw))/2 - var(--gap))}
.car-track:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;border-radius:18px}
.car-slide{all:unset;box-sizing:border-box;flex:0 0 var(--sw);scroll-snap-align:center;scroll-snap-stop:always;aspect-ratio:var(--ratio,12/5);border-radius:18px;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#1B2A3A,#2A3644);box-shadow:var(--shadow-md);opacity:.72;transform:scale(.965);transition:opacity .4s,transform .4s}
.car-slide.on{opacity:1;transform:none}
.car-slide:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px}
.car-slide img{width:100%;height:100%;object-fit:cover;display:block}
.car-nav{all:unset;cursor:pointer;position:absolute;top:calc(50% - 6px);transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(15,24,34,.28);display:none;align-items:center;justify-content:center;font-size:26px;line-height:1;color:var(--ink);z-index:3;transition:transform .15s,background .15s}
.car-nav:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
.car-nav:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px}
.car-nav.prev{left:10px}.car-nav.next{right:10px}
@media (min-width:700px){ .car-nav{display:flex} }
.car-dots{display:flex;justify-content:center;gap:7px;margin-top:0}
.car-dots button{all:unset;cursor:pointer;width:8px;height:8px;border-radius:5px;background:#C3CBD6;transition:width .25s,background .25s}
.car-dots button.on{width:24px;background:var(--blue)}
.car-dots button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.car.car-ads .car-track{--sw:80%}
@media (min-width:900px){ .car-track{--sw:66%} .car.car-ads .car-track{--sw:46%} }
.car[data-n="1"] .car-track{--sw:100%;gap:0}
.car[data-n="1"] .car-track::before,.car[data-n="1"] .car-track::after{display:none}
.car[data-n="1"] .car-slide{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){ .car-slide,.car-nav,.car-dots button{transition:none} }

/* pilihan bagian kaca */
.areas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){ .areas{grid-template-columns:1fr} }
.area{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:22px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;transition:border-color .12s,background .12s}
.area .box{grid-row:1/3;width:22px;height:22px;border-radius:7px;border:2px solid #B9C3CF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;background:#fff}
.area .a-name{font-weight:700;font-size:13.5px;line-height:1.25}
.area small{color:var(--muted);font-size:11.5px;font-weight:600}
.area[aria-checked="true"]{border-color:var(--blue);background:var(--blue-soft)}
.area[aria-checked="true"] .box{background:var(--blue);border-color:var(--blue)}
.area:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px}
.areas-tools{display:flex;gap:14px;margin:8px 0 0}
.areas-tools button{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--blue)}
.areas-tools button:hover{text-decoration:underline}
.opt-sub{font-size:12.5px;color:var(--muted);font-weight:600;margin:14px 0 8px}
.size-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
@media (max-width:520px){ .size-strip{grid-template-columns:repeat(2,minmax(0,1fr))} }
.size-strip div{min-width:0;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center;font-size:11.5px;line-height:1.3}
.size-strip b{display:block;font-size:11px;color:var(--muted);letter-spacing:.02em}
.size-strip span{font-weight:800;font-size:12px}
.size-strip div.on{border-color:var(--blue);background:var(--blue-soft)}
.size-strip div.on b{color:var(--blue)}
.buybar .tot b{font-size:15.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.opt-label{flex-wrap:wrap}
.stamp{display:block;margin-top:4px;font-size:11px;opacity:.7}

.ci{display:inline-flex;align-items:center;justify-content:center;width:var(--s);height:var(--s);font-size:calc(var(--s)*.62);line-height:1;flex:none;vertical-align:middle}
.ci img{width:100%;height:100%;object-fit:cover;border-radius:calc(var(--s)*.24);display:block}
.pimg .ph .ci img{box-shadow:0 6px 16px rgba(22,32,43,.16)}
.cat-tile .ico.has-img{padding:0;overflow:hidden;background:#fff}
.cat-tile .ico.has-img img{width:100%;height:100%;object-fit:cover;display:block}
.sortbar button{display:inline-flex;align-items:center;gap:6px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" id="brand"><img id="logo" alt="" hidden><span class="brand-name" id="storeName">Toko Aksesoris Mobil</span></a>
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cari kaca film, karpet..." aria-label="Cari produk"></label>
    <a class="icon-btn" href="#/cart" aria-label="Keranjang"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg><span class="count" id="cartCount"></span></a>
    <a class="icon-btn acct" href="#/account" id="acctBtn" aria-label="Masuk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></a>
  </div>
</header>
<main id="app" class="wrap" aria-live="polite"></main>
<nav class="bnav" id="bnav" aria-label="Navigasi">
  <a href="#/" data-nav="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Beranda</a>
  <a href="#/promo" data-nav="promo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Promo</a>
  <a href="#/deal" data-nav="deal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.5 2 1.5 3 3 3-1-3 0-6 0-8.5z"/></svg>Deal</a>
  <a href="#/cart" data-nav="cart"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 8H6"/></svg>Keranjang<span class="count" id="cartCount2"></span></a>
  <a href="#/orders" data-nav="orders"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Pesanan</a>
</nav>
<script>
/* =====================================================================
   Toko aksesoris mobil — front end (independen, pemasangan di alamat pembeli).
   Katalog, harga, kode promo, banner, pembayaran diatur dari Drive Desk
   (menu Toko Online) lewat Firebase Realtime Database.
   Isi DB_URL di bawah, atau buka toko dengan ?db=<database URL>.
   ===================================================================== */
const DB_URL = '';

const LS = { get:(k,d)=>{ try{ const v = localStorage.getItem('toko:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
             set:(k,v)=>{ try{ localStorage.setItem('toko:'+k, JSON.stringify(v)); }catch(e){} },
             del:k=>{ try{ localStorage.removeItem('toko:'+k); }catch(e){} } };
function dbUrl(){ const qp = new URLSearchParams(location.search).get('db'); if(qp) LS.set('db', qp); return (DB_URL || qp || LS.get('db','') || '').replace(/\/+$/,''); }
const DB = dbUrl();
let auth = null, user = null, profile = null;
async function api(path, opts, needAuth){
  let q = '';
  if(needAuth){ if(!user) throw new Error('not-signed-in'); q = '?auth=' + encodeURIComponent(await user.getIdToken()); }
  const r = await fetch(`${DB}/${path}.json${q}`, Object.assign({ headers:{'Content-Type':'application/json'} }, opts||{}));
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

let CAT = null;
const imgCache = {};
function imgSrc(id){ if(!id) return Promise.resolve(''); if(!imgCache[id]) imgCache[id] = api('pos/images/'+id).then(v=>v||'').catch(()=>''); return imgCache[id]; }
function hydrate(root){ (root||document).querySelectorAll('img[data-img]').forEach(async el=>{ const s = await imgSrc(el.dataset.img); if(s){ el.src = s; el.hidden = false; const ph = el.parentElement && el.parentElement.querySelector('.ph'); if(ph) ph.remove(); } }); }
const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp' + Math.round(Number(n)||0).toLocaleString('id-ID');
const enc = v => encodeURIComponent(v);
const today = ()=>{ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2800); }
function waLink(phone, text){ let n = String(phone||'').replace(/\D/g,''); if(n.startsWith('0')) n = '62'+n.slice(1); return `https://wa.me/${n}?text=${encodeURIComponent(text||'')}`; }
async function sha(text){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

/* ---------- produk ---------- */
function dealOn(d){ return !!(d && d.value>0 && (!d.until || d.until>=today())); }
function applyDeal(price, d){ if(!dealOn(d)) return price; return d.type==='persen' ? Math.round(price*(1-d.value/100)) : Math.max(0, price-d.value); }
function dealTag(d){ return d.type==='persen' ? `-${d.value}%` : `Hemat ${rp(d.value)}`; }
function catOf(id){ return (CAT.categories||[]).find(c=>c.id===id) || {}; }
/* ikon kategori: gambar dari backend, emoji hanya cadangan kalau belum diunggah */
function catIco(c, size){ return `<span class="ci" style="--s:${size}px">${c && c.iconData ? `<img src="${esc(c.iconData)}" alt="">` : esc((c && c.icon) || '🛒')}</span>`; }
function products(){
  if(!CAT) return [];
  const out = [];
  const push = (kind, id, categoryId, name, brand, badge, images, prices, deal, data)=>{
    const p = prices.filter(v=>v>0); if(!p.length) return;
    const min = Math.min(...p); out.push({ kind, id, categoryId, name, brand, badge, images:images||[], fromNormal:min, from:applyDeal(min, deal), deal: dealOn(deal)?deal:null, data });
  };
  CAT.film.brands.forEach(b=>push('film', b.id, 'cat_film', 'Kaca Film '+b.name, b.name, b.badge, b.images, filmPriceList(b), b.deal, b));
  CAT.carpets.forEach(c=>push('karpet', c.id, 'cat_karpet', 'Karpet Custom '+c.name, c.name, '', c.images, Object.values(c.prices).flatMap(m=>Object.values(m||{})), c.deal, c));
  CAT.products.forEach(x=>push('generic', x.id, x.categoryId, x.name, x.brand, '', x.images, (x.variants||[]).map(v=>Number(v.price)), x.deal, x));
  return out;
}
function productUrl(p){ return `#/p/${p.kind}/${enc(p.id)}`; }
function shadeColor(pct){ const a = Math.min(.92, Number(String(pct).replace('%',''))/100); return `rgba(22,32,43,${a})`; }
function sideLabel(k){ return ((CAT.film.sides||[]).find(s=>s.key===k)||{}).label || k; }
function carLabel(c){ return c && c.brand && c.model ? `${c.brand} ${c.model}` : ''; }
function sizeOfLabel(label){
  if(!label) return '';
  for(const c of (CAT.cars||[])){ if(label.startsWith(c.brand+' ')){ const m = label.slice(c.brand.length+1); if((c.models||[]).includes(m)) return (c.sizes||{})[m] || ''; } }
  return '';
}
function areasOf(name){ return Object.values((CAT.film.packages||{})[name]||{}); }
function filmPriceFor(b, size, areas){
  if(!size || !areas || !areas.length) return 0;
  const order = Object.values(CAT.film.sides||{}).map(x=>x.key); const idx = k=>order.indexOf(k);
  let target = 0; for(const a of areas){ const i = idx(a); if(i<0) return 0; target |= 1<<i; }
  const pr = (b.prices||{})[size] || {}; const items = [];
  Object.keys(CAT.film.packages||{}).forEach(name=>{
    const price = Number(pr[name]); if(!(price>0)) return;
    let m = 0, ok = true; areasOf(name).forEach(a=>{ const i = idx(a); if(i<0) ok = false; else m |= 1<<i; });
    if(ok && m) items.push({ m, price });
  });
  /* pilihan sama persis dengan satu paket → pakai harga paket itu; selain itu hitung kombinasi termurah */
  const exact = items.find(it=>it.m===target); if(exact) return exact.price;
  const best = new Array(1<<order.length).fill(Infinity); best[0] = 0;
  for(let mask=1; mask<best.length; mask++){ for(const it of items){ if((it.m & mask)===it.m){ const c = best[mask ^ it.m] + it.price; if(c<best[mask]) best[mask] = c; } } }
  return isFinite(best[target]) ? best[target] : 0;
}
function filmPriceList(b){ return Object.values(b.prices||{}).flatMap(o=>Object.values(o||{})).map(Number).filter(v=>v>0); }

function itemPrices(it){
  let normal = 0, deal = null;
  if(it.kind==='film'){ const b = CAT.film.brands.find(x=>x.id===it.pid); if(b){ const ars = (it.areas && it.areas.length) ? it.areas : ((it.sides||[]).length ? it.sides.map(x=>x.side) : areasOf(it.pkg)); normal = filmPriceFor(b, sizeOfLabel(it.car), ars); deal = b.deal; } }
  else if(it.kind==='karpet'){ const c = CAT.carpets.find(x=>x.id===it.pid); if(c){ normal = Number((c.prices[it.car]||{})[it.pkg])||0; deal = c.deal; } }
  else { const x = CAT.products.find(y=>y.id===it.pid); if(x){ const v = (x.variants||[]).find(v=>v.name===it.variant); normal = v ? Number(v.price)||0 : 0; deal = x.deal; } }
  return { normal, price: applyDeal(normal, deal), deal: dealOn(deal) ? deal : null };
}
let promoState = { code: LS.get('promo',''), promo:null, error:'' };
async function resolvePromo(){
  promoState.promo = null; promoState.error = '';
  const code = (promoState.code||'').trim().toUpperCase(); if(!code) return;
  const h = await sha(code);
  const p = (CAT.promos||[]).find(x=>x.hash===h && (!x.until || x.until>=today()));
  if(!p){ promoState.error = 'Kode promo tidak ditemukan atau sudah berakhir.'; return; }
  promoState.promo = Object.assign({}, p, { code });
}
function totals(){
  let sub = 0, eligible = 0;
  const lines = cart.map(it=>{ const pr = itemPrices(it); const amount = pr.price*it.qty; sub += amount;
    const p = promoState.promo; if(p && (p.scope==='all' || p.scope===it.categoryId)) eligible += amount; return Object.assign({ it, amount }, pr); });
  let disc = 0, promoMsg = '';
  const p = promoState.promo;
  if(p){
    if(!eligible) promoMsg = `Kode ${p.code} hanya berlaku untuk ${esc(catOf(p.scope).name||'produk tertentu')}.`;
    else if(p.minSpend && eligible < p.minSpend) promoMsg = `Kode ${p.code} butuh minimal belanja ${rp(p.minSpend)}.`;
    else disc = p.type==='persen' ? Math.round(eligible*p.value/100) : Math.min(p.value, eligible);
  }
  return { lines, sub, disc, promoMsg };
}

function carousel(list, kind, opt){

    <div class="car-stage"><div class="car-track" tabindex="0">${list.map((b,i)=>`<button type="button" class="car-slide${i?'':' on'}" data-i="${i}" role="group" aria-roledescription="slide" aria-label="${i+1} dari ${list.length}: ${esc(b.title||o.label)}"><img data-img="${b.img}" alt="${esc(b.title||'')}" hidden></button>`).join('')}</div>
    ${list.length>1?`<button type="button" class="car-nav prev" aria-label="Sebelumnya">‹</button><button type="button" class="car-nav next" aria-label="Berikutnya">›</button>`:''}</div>
    ${list.length>1?`<div class="car-dots">${list.map((b,i)=>`<button type="button" data-i="${i}" aria-label="Slide ${i+1}" class="${i?'':'on'}"></button>`).join('')}</div>`:''}</section>`;

function bindCarousels(lists){
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let anyAuto = false;
  app.querySelectorAll('.car').forEach(car=>{
    const list = lists[car.dataset.kind] || [];
    const track = car.querySelector('.car-track'), slides = [...track.querySelectorAll('.car-slide')], dots = [...car.querySelectorAll('.car-dots button')];
    const n = slides.length; let cur = 0;
    slides.forEach(sl=>sl.addEventListener('click', ()=>{ const b = list[+sl.dataset.i]; if(b) bannerGo(b.link); }));
    if(n<2) return;
    const centerLeft = i=>{ const sl = slides[i]; return sl.offsetLeft + sl.offsetWidth/2 - track.clientWidth/2; };
    const setOn = i=>{ cur = i; slides.forEach((sl,j)=>sl.classList.toggle('on', j===i)); dots.forEach((d,j)=>{ d.classList.toggle('on', j===i); if(j===i) d.setAttribute('aria-current','true'); else d.removeAttribute('aria-current'); }); };
    const go = (i, smooth)=>{ i = (i+n)%n; track.scrollTo({ left:centerLeft(i), behavior: (smooth!==false && !reduced) ? 'smooth' : 'auto' }); setOn(i); };
    let raf = 0;
    track.addEventListener('scroll', ()=>{ cancelAnimationFrame(raf); raf = requestAnimationFrame(()=>{ const mid = track.scrollLeft + track.clientWidth/2; let best = 0, bd = 1e9; slides.forEach((sl,j)=>{ const d = Math.abs(sl.offsetLeft + sl.offsetWidth/2 - mid); if(d<bd){ bd = d; best = j; } }); if(best!==cur) setOn(best); }); }, { passive:true });
    const prev = car.querySelector('.car-nav.prev'), next = car.querySelector('.car-nav.next');
    if(prev) prev.onclick = ()=>go(cur-1); if(next) next.onclick = ()=>go(cur+1);
    dots.forEach(d=>d.onclick = ()=>go(+d.dataset.i));
    track.addEventListener('keydown', e=>{ if(e.key==='ArrowRight'){ e.preventDefault(); go(cur+1); } else if(e.key==='ArrowLeft'){ e.preventDefault(); go(cur-1); } });
    car._n = n; car._next = ()=>go(cur+1); car._paused = false;
    car.addEventListener('pointerenter', e=>{ if(e.pointerType==='mouse') car._paused = true; });
    car.addEventListener('pointerleave', e=>{ if(e.pointerType==='mouse') car._paused = false; });
    car.addEventListener('focusin', ()=>{ car._paused = true; }); car.addEventListener('focusout', ()=>{ car._paused = false; });
    car.addEventListener('touchstart', ()=>{ car._paused = true; }, { passive:true });
    car.addEventListener('touchend', ()=>{ setTimeout(()=>{ car._paused = false; }, 4500); }, { passive:true });
    if(car.dataset.auto==='1') anyAuto = true;
  });
  clearInterval(slideTimer);
  if(anyAuto && !reduced) slideTimer = setInterval(()=>{
    const cars = [...document.querySelectorAll('#app .car[data-auto="1"]')];
    if(!cars.length) return clearInterval(slideTimer);
    cars.forEach(c=>{ if(c._n>1 && !c._paused && !document.hidden) c._next(); });
  }, 5000);
}

      if(kind==='karpet'){ it.pkg = st.pkg; it.color = st.color; }
      if(kind==='generic') it.variant = st.variant;
      cart.push(it); saveCart();
    };
    document.getElementById('addCart').onclick = ()=>{ add(); toast('Ditambahkan ke keranjang'); };

function itemOptions(it){
  const o = [];
  if(it.car){ const sz = it.kind==='film' ? sizeOfLabel(it.car) : ''; o.push(sz ? `${it.car} (${sz})` : it.car); }
  if(it.kind==='film'){ o.push(it.pkg==='Full' ? 'Full' : 'Partial · '+it.pkg); (it.sides||[]).forEach(s=>o.push(`${s.label} ${s.shade}`)); }
  if(it.kind==='karpet'){ o.push(it.pkg); if(it.color) o.push('Warna '+it.color); }
  if(it.kind==='generic' && it.variant && it.variant!=='Standar') o.push(it.variant);
  return o;
}

  app.querySelectorAll('[data-inc]').forEach(b=>b.onclick = ()=>{ const i = find(b.dataset.inc); i.qty = Math.min(20,i.qty+1); saveCart(); viewCart(); });
  app.querySelectorAll('[data-dec]').forEach(b=>b.onclick = ()=>{ const i = find(b.dataset.dec); i.qty = Math.max(1,i.qty-1); saveCart(); viewCart(); });
  const ap = document.getElementById('promoApply');
  if(ap){ const go = ()=>{ promoState.code = document.getElementById('promoIn').value.trim().toUpperCase(); LS.set('promo', promoState.code); viewCart(); }; ap.onclick = go; document.getElementById('promoIn').onkeydown = e=>{ if(e.key==='Enter') go(); }; }
  const rm = document.getElementById('promoRm'); if(rm) rm.onclick = ()=>{ promoState.code = ''; LS.del('promo'); viewCart(); };
}

function shippingOptions(){ const cats = [...new Set(cart.map(i=>i.categoryId))]; return (CAT.shipping||[]).filter(s=>!s.applies || s.applies==='all' || cats.every(c=>c===s.applies)); }
function paymentOptions(){
  const p = CAT.payments||{}; const out = [];
  if(p.cash!==false) out.push({ key:'cash', label:'Cash', sub:'Bayar tunai ke teknisi saat pemasangan / ke kurir' });
  if(p.transfer && (p.banks||[]).length) out.push({ key:'transfer', label:'Transfer Bank', sub:(p.banks||[]).map(b=>b.bank).join(', ') });
  if(p.qris) out.push({ key:'qris', label:'QRIS', sub:'Scan pakai e-wallet atau m-banking' });
  return out;
}

async function placeOrder(f, ship, fee, install, t, v){
  const err = document.getElementById('cerr');
  const nama = v.nm.trim(), wa = v.wa.replace(/[^\d+]/g,''), alamat = v.al.trim();
  if(!nama){ err.textContent = 'Isi nama lengkap.'; return; }
  if(wa.replace(/\D/g,'').length < 9){ err.textContent = 'Isi nomor WhatsApp yang aktif.'; return; }
  if(alamat.length < 10){ err.textContent = 'Isi alamat lengkap.'; return; }
  if(install && !v.dt){ err.textContent = 'Pilih tanggal pemasangan.'; return; }
  if(install && !v.tm){ err.textContent = 'Pilih waktu pemasangan.'; return; }
  const pay = paymentOptions().find(p=>p.key===f.pay);
  const btn = document.getElementById('place'); btn.disabled = true; btn.textContent = 'Memproses...';
  const d = new Date(); const pad = n=>String(n).padStart(2,'0');
  const orderNo = `TA${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}${pad(d.getDate())}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
  const order = {
    orderNo, uid:user.uid, createdAt:d.toISOString(), status:'baru',
    customer:{ nama, wa, email:user.email, username:(profile||{}).username||'', alamat, mobil:[...new Set(cart.map(i=>i.car).filter(Boolean))].join(', ') },
    items: t.lines.map(({it,price,normal,deal})=>({ kind:it.kind, title:it.title, options:itemOptions(it), qty:it.qty, price, normalPrice:normal, deal: deal ? dealTag(deal) : '' })),
    subtotal:t.sub, promo: t.disc ? { code:promoState.promo.code, discount:t.disc } : null,
    shipping:{ id:ship.id, name:ship.name, fee, install }, grandTotal:t.sub-t.disc+fee,
    payment:{ method:pay.key, label:pay.label }, installDate: install ? v.dt : '', installTime: install ? v.tm : '', note: v.nt.trim()
  };
  try{
    const res = await api('pos/orders', { method:'POST', body:JSON.stringify(order) }, true);
    await api(`shop/customers/${user.uid}/orders/${res.name}`, { method:'PUT', body:'true' }, true).catch(()=>{});
    await api(`shop/customers/${user.uid}`, { method:'PATCH', body:JSON.stringify({ wa, alamat }) }, true).then(()=>{ profile = Object.assign(profile||{}, { wa, alamat }); }).catch(()=>{});
    cart = []; saveCart(); promoState = { code:'', promo:null, error:'' }; LS.del('promo');
    location.hash = '#/order/'+res.name;
  }catch(e){ console.error(e); btn.disabled = false; btn.textContent = 'Buat pesanan'; err.textContent = 'Pesanan gagal terkirim. Periksa koneksi lalu coba lagi.'; }
}

function uploadProof(key, btn){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange = ()=>{ const f = inp.files[0]; if(!f) return; const rd = new FileReader();
    rd.onload = ()=>{ const img = new Image(); img.onload = async ()=>{
      const s = Math.min(1, 1100/img.width); const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const ctx = c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
      btn.disabled = true; btn.textContent = 'Mengunggah...';
      try{ await api('pos/proofs/'+key, { method:'PUT', body:JSON.stringify(c.toDataURL('image/jpeg',0.72)) }, true);
           await api('pos/orders/'+key, { method:'PATCH', body:JSON.stringify({ proof:true, proofAt:new Date().toISOString() }) }, true);
           toast('Bukti pembayaran terkirim'); viewOrder(key); }
      catch(e){ btn.disabled = false; btn.textContent = 'Unggah bukti pembayaran'; toast('Gagal mengunggah. Coba lagi.'); }
    }; img.src = rd.result; };
    rd.readAsDataURL(f); };
  inp.click();
}

/* ---------- login, daftar, lupa password, akun ---------- */
const RECOVERY_QS = ['Nama hewan peliharaan pertama kamu?','Kota kelahiran ibu kamu?','Nama sekolah dasar kamu?','Merek mobil pertama kamu?','Makanan favorit waktu kecil?'];
function pwField(id, label, ac){ return `<div class="field"><label for="${id}">${label}</label><div class="pw"><input class="inp" id="${id}" type="password" autocomplete="${ac}"><button type="button" data-show="${id}">Lihat</button></div></div>`; }
function bindPw(){ app.querySelectorAll('[data-show]').forEach(b=>b.onclick = ()=>{ const i = document.getElementById(b.dataset.show); i.type = i.type==='password'?'text':'password'; b.textContent = i.type==='password'?'Lihat':'Sembunyikan'; }); }
function noAuthHtml(){ return `<div class="empty"><h3>Login belum tersedia</h3>Admin toko belum mengaktifkan login. Coba lagi nanti.</div>`; }

    <div id="lerr" class="err" role="alert"></div>

async function viewRegister(next){
  if(!auth){ app.innerHTML = noAuthHtml(); return; }
  await authReady(); if(user){ location.hash = '#/account'; return; }
  app.innerHTML = `<div class="panel auth-card"><h1>Daftar akun</h1><p class="sub">Satu akun untuk semua pesanan kamu.</p>
    <div class="field"><label for="ru">Username</label><input class="inp" id="ru" autocomplete="username" placeholder="huruf kecil, angka, _"><div class="hint">3–20 karakter, contoh: budi_ex5</div></div>
    <div class="field"><label for="rn">Nama lengkap</label><input class="inp" id="rn" autocomplete="name"></div>
    <div class="field"><label for="re">Email</label><input class="inp" id="re" type="email" autocomplete="email"></div>
    ${pwField('rp','Password','new-password')}
    ${pwField('rp2','Ulangi password','new-password')}
    <div class="field"><label for="rq">Pertanyaan pemulihan</label><select class="inp" id="rq">${RECOVERY_QS.map(q=>`<option>${esc(q)}</option>`).join('')}</select></div>
    <div class="field"><label for="ra">Jawaban</label><input class="inp" id="ra" autocomplete="off"><div class="hint">Dipakai admin untuk memastikan identitas kamu kalau butuh bantuan akun.</div></div>
    <div id="rerr" class="err" role="alert"></div>
    <button class="btn block" id="rbtn" style="margin-top:6px">Daftar</button>
    <p class="auth-alt">Sudah punya akun? <a href="#/login/${enc(next)}">Masuk</a></p></div>`;
  bindPw();
  document.getElementById('rbtn').onclick = async ()=>{
    const g = id=>document.getElementById(id).value; const er = document.getElementById('rerr'); const b = document.getElementById('rbtn');
    const username = g('ru').trim().toLowerCase(), nama = g('rn').trim(), email = g('re').trim(), pass = g('rp'), q = g('rq'), ans = g('ra').trim();
    if(!/^[a-z0-9_]{3,20}$/.test(username)){ er.textContent = 'Username 3–20 karakter: huruf kecil, angka atau _.'; return; }
    if(nama.length<3){ er.textContent = 'Isi nama lengkap.'; return; }

    if(pass.length<6){ er.textContent = 'Password minimal 6 karakter.'; return; }

      const cred = await auth.createUserWithEmailAndPassword(email, pass); user = cred.user;
      await cred.user.updateProfile({ displayName:nama }).catch(()=>{});
      await api('shop/usernames/'+username, { method:'PUT', body:JSON.stringify(cred.user.uid) }, true);
      const prof = { username, nama, email, wa:'', alamat:'', recoveryQ:q, recoveryAHash: await sha(ans.toLowerCase()), createdAt:new Date().toISOString() };
      await api('shop/customers/'+cred.user.uid, { method:'PUT', body:JSON.stringify(prof) }, true);
      profile = prof; toast('Akun berhasil dibuat'); location.hash = next ? '#/'+next : '#/';
    }catch(x){ er.textContent = String(x.message).startsWith('HTTP') ? 'Akun dibuat, tapi profil gagal disimpan. Hubungi admin.' : authErr(x); b.disabled = false; b.textContent = 'Daftar'; }
  };
}
function viewForgot(){
  if(!auth){ app.innerHTML = noAuthHtml(); return; }
  app.innerHTML = `<div class="panel auth-card"><h1>Lupa password</h1><p class="sub">Masukkan email akun kamu. Kami akan mengirim link untuk membuat password baru.</p>
    <div id="fbox"><div class="field"><label for="fe">Email</label><input class="inp" id="fe" type="email" autocomplete="email"></div>
    <div id="ferr" class="err" role="alert"></div><button class="btn block" id="fbtn" style="margin-top:6px">Kirim link reset</button></div>
    <p class="auth-alt"><a href="#/login">Kembali ke halaman masuk</a></p></div>`;
  document.getElementById('fbtn').onclick = async ()=>{
    const e = document.getElementById('fe').value.trim(); const er = document.getElementById('ferr'); const b = document.getElementById('fbtn');
    if(!/^\S+@\S+\.\S+$/.test(e)){ er.textContent = 'Format email tidak valid.'; return; }
    b.disabled = true; b.textContent = 'Mengirim...';
    try{ await auth.sendPasswordResetEmail(e); }catch(x){ if(!String(x.code).includes('user-not-found')){ er.textContent = authErr(x); b.disabled = false; b.textContent = 'Kirim link reset'; return; } }
    document.getElementById('fbox').innerHTML = `<div class="ok-msg">Kalau <b>${esc(e)}</b> terdaftar, link reset password sudah dikirim. Cek kotak masuk dan folder spam.</div>`;
  };
}
async function viewAccount(){
  await authReady(); if(!requireLogin('account')) return;
  const p = profile || {};
  app.innerHTML = `<div class="acct-head"><div class="avatar">${esc((p.nama||user.email||'?').charAt(0).toUpperCase())}</div><div><b style="font-size:17px">${esc(p.nama||user.displayName||'')}</b><div style="color:#C7D0DA;font-size:13px">@${esc(p.username||'-')} · ${esc(user.email)}</div></div></div>
    <div class="panel" style="margin-top:12px"><h2 style="margin:0 0 12px;font-size:16px">Data untuk pemasangan</h2>
      <div class="field"><label for="aw">No. WhatsApp</label><input class="inp" id="aw" inputmode="tel" value="${esc(p.wa)}"></div>
      <div class="field"><label for="aa">Alamat</label><textarea class="inp" id="aa">${esc(p.alamat)}</textarea></div>
      <button class="btn" id="asave">Simpan</button></div>
    <div class="panel" style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
      <a class="btn line block" href="#/orders">Riwayat pembelian</a>
      <a class="btn line block" href="#/fav">🤍 Favorit saya</a>
      <button class="btn line block" id="alogout" style="color:var(--price);border-color:var(--price)">Keluar</button></div>`;
  document.getElementById('asave').onclick = async ()=>{
    const wa = document.getElementById('aw').value.trim(), alamat = document.getElementById('aa').value.trim();
    try{ await api('shop/customers/'+user.uid, { method:'PATCH', body:JSON.stringify({ wa, alamat }) }, true); profile = Object.assign(profile||{}, { wa, alamat }); toast('Data disimpan'); }catch(e){ toast('Gagal menyimpan'); }
  };
  document.getElementById('alogout').onclick = async ()=>{ await auth.signOut(); location.hash = '#/'; };
}

/* ---------- boot ---------- */
let catLoadedAt = 0;
function prepCatalog(){
  CAT.film = CAT.film || { sides:[], packages:{}, brands:[] }; CAT.film.brands = CAT.film.brands||[];
  ['carpets','products','banners','promos','shipping','categories','cars'].forEach(k=>{ CAT[k] = CAT[k]||[]; });
  CAT.payments = CAT.payments||{}; CAT.store = CAT.store||{};
  CAT.film.sizes = CAT.film.sizes || ['Small','Medium','Large','XL'];
  CAT.cars.forEach(c=>{ c.sizes = c.sizes||{}; });
  CAT.film.brands.forEach(b=>{ b.prices = b.prices||{}; b.shades = b.shades||{}; b.images = b.images||[]; });
  /* katalog lama (sebelum ada ukuran): satu harga untuk semua ukuran */
  CAT.film.brands.forEach(b=>{ const keys = Object.keys(b.prices); if(keys.some(k=>!CAT.film.sizes.includes(k))){ const flat = {}; keys.forEach(k=>{ if(!CAT.film.sizes.includes(k)) flat[k] = b.prices[k]; }); b.prices = {}; CAT.film.sizes.forEach(z=>{ b.prices[z] = Object.assign({}, flat); }); } });
  if(!(CAT.v>=3)) CAT.cars.forEach(c=>(c.models||[]).forEach(m=>{ if(!c.sizes[m]) c.sizes[m] = CAT.film.sizes[0]; }));
  CAT.carpets.forEach(c=>{ c.prices = c.prices||{}; c.packages = c.packages||[]; c.colors = c.colors||[]; c.images = c.images||[]; });
  CAT.products.forEach(x=>{ x.variants = x.variants||[]; x.images = x.images||[]; });
  CAT.cars.forEach(c=>{ c.models = c.models||[]; });
}
async function refreshCatalog(){
  try{
    const c = await api('pos/catalog'); catLoadedAt = Date.now();
    if(!c || (CAT && c.updatedAt===CAT.updatedAt)) return;
    CAT = c; prepCatalog();
    const first = (location.hash.replace(/^#/,'')||'/').split('/').filter(Boolean)[0] || '';
    if(['','c','search','promo','deal','fav','cart'].includes(first)) route();
    toast('Katalog toko diperbarui');
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && CAT && Date.now()-catLoadedAt > 90000) refreshCatalog(); });

async function boot(){
  saveCart();
  if(!DB){ app.innerHTML = `<div class="empty"><h3>Toko belum terhubung</h3><p>Isi <code>DB_URL</code> di file toko.html, atau buka toko lewat link dari admin.</p></div>`; return; }
  app.innerHTML = `<div class="skel" style="aspect-ratio:12/5;margin-top:16px"></div><div class="grid" style="margin-top:20px">${'<div class="skel" style="aspect-ratio:3/4"></div>'.repeat(4)}</div>`;
  try{ CAT = await api('pos/catalog'); }catch(e){ CAT = null; }
  if(!CAT){ app.innerHTML = `<div class="empty"><h3>Katalog belum tersedia</h3><p>Toko sedang disiapkan. Coba beberapa saat lagi.</p><button class="btn" onclick="boot()">Coba lagi</button></div>`; return; }
  prepCatalog(); catLoadedAt = Date.now();
  document.title = CAT.store.name || 'Toko Aksesoris Mobil';
  document.getElementById('storeName').textContent = CAT.store.name || 'Toko Aksesoris Mobil';
  if(CAT.store.logo){ const l = document.getElementById('logo'); l.dataset.img = CAT.store.logo; hydrate(document.querySelector('.top')); }
  initAuth();
  if(auth) await new Promise(r=>{ const off = auth.onAuthStateChanged(()=>{ off(); r(); }); setTimeout(r, 4000); });
  booted = true;
  route();
}
boot();


/* Ruang bawah otomatis: konten tidak pernah tertutup menu bawah / bar harga */
(function(){
  let raf = 0;
  function measure(){
    raf = 0;
    let h = 0;
    document.querySelectorAll('.bnav, .buybar, .checkout-bar, .sticky-bottom').forEach(el=>{
      const cs = getComputedStyle(el);
      if(cs.display==='none' || cs.visibility==='hidden' || cs.position!=='fixed') return;
      const r = el.getBoundingClientRect();
      if(r.height && r.bottom >= window.innerHeight - 2) h = Math.max(h, r.height);
    });
    const space = Math.max(40, Math.ceil(h) + 28);
    document.documentElement.style.setProperty('--bottom-space', space + 'px');
  }
  function schedule(){ if(!raf) raf = requestAnimationFrame(measure); }
  window.addEventListener('resize', schedule);
  window.addEventListener('hashchange', ()=>setTimeout(schedule, 0));
  new MutationObserver(schedule).observe(document.body, { childList:true, subtree:true, attributes:true, attributeFilter:['class','style'] });
  if(window.ResizeObserver){ const ro = new ResizeObserver(schedule); document.querySelectorAll('.bnav').forEach(el=>ro.observe(el)); }
  schedule();
})();
</script>
